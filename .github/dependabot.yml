# Weekly dependency update PRs. CI runs on each one, so a Playwright bump is
# tested against its new Chromium before merging.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          # One PR for all minor/patch dev-tool updates; majors come separately.
          dev-tools:
              patterns: ['*']
              # Phaser is the game engine: its updates can change how the game
              # looks or responds, and are worth trying on their own PR.
              exclude-patterns: [phaser]
              update-types: [minor, patch]
      ignore:
          # typescript-eslint supports TypeScript only below 6.1 (its peer
          # range). Lift this once typescript-eslint accepts newer versions.
          - dependency-name: typescript
            versions: ['>=6.1.0']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
