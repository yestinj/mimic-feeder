<svg xmlns="http://www.w3.org/2000/svg" width="240" height="18" viewBox="0 0 240 18">
  <!-- Bar fill, tinted per use (XP, boss health). White so the tint sets the colour. -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d9d9d9"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="240" height="18" rx="9" fill="url(#fill)"/>
  <rect x="6" y="3" width="228" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.55"/>
</svg>
